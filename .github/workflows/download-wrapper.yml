name: Download and Commit Gradle Wrapper JAR

on:
  workflow_dispatch:

jobs:
  setup-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Create gradle/wrapper directory
        run: mkdir -p gradle/wrapper

      - name: Download gradle-wrapper.jar
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://repo.gradle.org/gradle/libs-releases-local/org/gradle/gradle-wrapper/8.6/gradle-wrapper-8.6.jar"
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push gradle-wrapper.jar
        run: |
          git add gradle/wrapper/gradle-wrapper.jar
          git commit -m "Add gradle-wrapper.jar for Gradle 8.6"
          git push
